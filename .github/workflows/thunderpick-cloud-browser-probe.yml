name: Thunderpick Cloud Browser Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/thunderpick-cloud-browser-probe.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Chrome
        run: |
          which google-chrome
          google-chrome --version
      - name: Install browser driver
        run: npm install --no-save puppeteer-core@24.16.0
      - name: Probe Thunderpick first-party API from in-page browser
        run: node scripts/thunderpick-cloud-browser-probe.mjs
      - name: Publish probe
        run: |
          git config user.name 'thunderpick-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/thunderpick-cloud-browser-probe.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record cloud browser Thunderpick probe [skip ci]'
          git pull --rebase --autostash origin main
          git push origin HEAD:main
