name: Thunderpick Simple Scan Watchdog (Legacy Manual)

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Check simple-board freshness and recover
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const {execFileSync}=require('child_process');
          let stale=true, ageMin=null, generatedAt=null;
          try {
            const r=JSON.parse(fs.readFileSync('data/simple-opportunity-latest.json','utf8'));
            generatedAt=r.generatedAt||null;
            const ts=Date.parse(generatedAt||'');
            if(Number.isFinite(ts)) { ageMin=(Date.now()-ts)/60000; stale=ageMin>70; }
          } catch(e) { console.error('SIMPLE_BOARD_FRESHNESS_READ_FAILED',e.message); }
          console.log('SIMPLE_BOARD_FRESHNESS',{generatedAt,ageMin,stale});
          if(stale){
            execFileSync('gh',['workflow','run','thunderpick-simple-hourly.yml','--ref','main'],{stdio:'inherit'});
            console.log('SIMPLE_BOARD_RECOVERY_DISPATCH_SENT');
          } else console.log('SIMPLE_BOARD_FRESH_NO_RECOVERY_NEEDED');
          NODE
