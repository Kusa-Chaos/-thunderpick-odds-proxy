name: Owls Extra Source Probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/owls-extra-probe.mjs'
      - '.github/workflows/owls-extra-probe.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - env:
          OWLS_API_KEY: ${{ secrets.OWLS_API_KEY }}
        run: node scripts/owls-extra-probe.mjs
      - run: |
          git config user.name 'thunderpick-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/owls-extra-probe.json
          git commit -m 'Update extra source probe [skip ci]' || exit 0
          git push
