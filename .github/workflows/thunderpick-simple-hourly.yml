name: Thunderpick Simple Hourly Board

on:
  workflow_dispatch:
  schedule:
    - cron: '27 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/simple-opportunity-board.mjs'
      - 'scripts/direct-source-collector.mjs'
      - '.github/workflows/thunderpick-simple-hourly.yml'

permissions:
  contents: write

concurrency:
  group: thunderpick-simple-hourly
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh Thunderpick
        env:
          OWLS_API_KEY: ${{ secrets.OWLS_API_KEY }}
        run: node scripts/owls-thunderpick.mjs
      - name: Collect quota-free direct sources
        run: node scripts/direct-source-collector.mjs
      - name: Exact safety screen
        run: node scripts/screen-thunderpick-ev.mjs
      - name: Build simple discovery-first board
        run: node scripts/simple-opportunity-board.mjs
      - name: Publish simple board
        run: |
          git config user.name 'thunderpick-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A data/
          git diff --cached --quiet && exit 0
          git commit -m 'Update simple Thunderpick opportunity board [skip ci]'
          # Generated diagnostics must never block rebase/publish.
          git status --porcelain
          for n in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep $((n*3))
          done
          exit 1
