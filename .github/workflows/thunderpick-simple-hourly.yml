# Production reliability hardening: 2026-09-29
name: Thunderpick Simple Hourly Board

on:
  workflow_dispatch:
  schedule:
    - cron: '40 * * * *'
    - cron: '50 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/thunderpick-firstparty-browser.mjs'
      - 'scripts/thunderpick-public-reader.mjs'
      - 'scripts/merge-aws-thunderpick.mjs'
      - 'scripts/simple-opportunity-board.mjs'
      - 'scripts/simple-direct-discovery.mjs'
      - 'scripts/simple-two-source-watch.mjs'
      - 'scripts/simple-nfl-prop-watch.mjs'
      - 'scripts/direct-public-sources.mjs'
      - 'scripts/kalshi-rate-limited.mjs'
      - 'scripts/betway-direct.mjs'
      - 'scripts/pinnacle-direct.mjs'
      - 'scripts/pinnwire-direct.mjs'
      - 'scripts/kambi-direct.mjs'
      - 'scripts/kambi-traditional-direct.mjs'
      - 'scripts/kambi-nfl-direct.mjs'
      - 'scripts/bovada-nfl-direct.mjs'
      - 'scripts/bovada-traditional-direct.mjs'
      - 'scripts/fanduel-direct.py'
      - 'scripts/fanduel-props-direct.py'
      - 'scripts/draftkings-nfl-direct.py'
      - 'scripts/draftkings-traditional-direct.py'
      - 'scripts/merge-direct-sources.mjs'
      - 'scripts/audit-production-coverage.mjs'
      - 'scripts/production-reliability.mjs'
      - 'config/production-coverage-contract.json'
      - 'control/scan-trigger.txt'
      - '.github/workflows/thunderpick-simple-hourly.yml'

permissions:
  contents: write
  id-token: write

concurrency:
  group: thunderpick-simple-hourly
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run_scan: ${{ steps.decide.outputs.run_scan }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
      - name: Decide whether this trigger needs a real scan
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_EXPR: ${{ github.event.schedule }}
        run: |
          node - <<'NODE'
          const fs=require('fs'); const event=process.env.EVENT_NAME||''; const schedule=process.env.SCHEDULE_EXPR||'';
          let run=true, reason=`${event||'unknown'} trigger`;
          if(event==='schedule'&&schedule==='40 * * * *'){reason='authoritative :40 hourly production scan; always run';}
          else if(event==='schedule'&&schedule==='50 * * * *'){
            let ageMin=Infinity,generatedAt=null; try{const b=JSON.parse(fs.readFileSync('data/simple-opportunity-latest.json','utf8'));generatedAt=b.generatedAt||null;ageMin=(Date.now()-Date.parse(generatedAt||''))/60000;}catch(_){}
            const fresh=Number.isFinite(ageMin)&&ageMin>=0&&ageMin<=20; run=!fresh;
            reason=fresh?`:50 recovery check: board fresh (${ageMin.toFixed(1)}m; ${generatedAt}); skip duplicate`:`:50 recovery check: no <=20m authoritative board (${generatedAt||'missing'}); run recovery scan`;
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`run_scan=${run?'true':'false'}\nreason=${reason.replace(/\n/g,' ')}\n`);
          NODE

  scan:
    needs: gate
    if: needs.gate.outputs.run_scan == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Gate reason
        run: echo "${{ needs.gate.outputs.reason }}"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Run reliability regression tests
        run: node --test tests/production-reliability.test.mjs
      - name: Configure read-only AWS collector access
        id: awscreds
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::367398820205:role/ThunderpickGitHubSnapshotReadRole
          aws-region: us-east-2
      - name: Seed fresh NFL snapshot from AWS
        if: steps.awscreds.outcome == 'success'
        continue-on-error: true
        run: |
          aws s3 cp s3://thunderpick-cloud-367398820205-us-east-2/collector/thunderpick-direct-latest.json data/aws-thunderpick-direct-latest.json --no-progress
          aws s3 cp s3://thunderpick-cloud-367398820205-us-east-2/collector/thunderpick-direct-meta.json data/aws-thunderpick-direct-meta.json --no-progress
          node scripts/merge-aws-thunderpick.mjs
      - name: Install first-party browser driver
        run: npm install --no-save puppeteer-core@24.16.0
      - name: Install direct sportsbook TLS client
        run: pip install --disable-pip-version-check 'curl_cffi==0.16.3'
      - name: Refresh Thunderpick directly from first-party sportsbook
        timeout-minutes: 6
        env: { TP_DEEP_CONCURRENCY: '4', TP_REQUEST_GAP_MS: '160' }
        run: node scripts/thunderpick-firstparty-browser.mjs
      - name: Refresh NFL through free first-party public reader fallback
        continue-on-error: true
        run: node scripts/thunderpick-public-reader.mjs
      - name: Collect quota-free public sources
        run: node scripts/direct-public-sources.mjs
      - name: Recover Kalshi safely after rate limiting
        run: node scripts/kalshi-rate-limited.mjs
      - name: Add Betway independent bookmaker source
        run: node scripts/betway-direct.mjs
      - name: Add Pinnacle independent bookmaker source
        run: node scripts/pinnacle-direct.mjs
      - name: Add PinnWire Pinnacle esports depth
        continue-on-error: true
        run: node scripts/pinnwire-direct.mjs
      - name: Add Unibet Kambi esports deep market and prop source
        run: node scripts/kambi-direct.mjs
      - name: Add Unibet Kambi traditional-sports deep markets and props
        run: node scripts/kambi-traditional-direct.mjs
      - name: Add Unibet Kambi NFL lines and player props
        run: node scripts/kambi-nfl-direct.mjs
      - name: Add Bovada NFL lines and player props
        run: node scripts/bovada-nfl-direct.mjs
      - name: Add Bovada traditional-sports lines and player props
        run: node scripts/bovada-traditional-direct.mjs
      - name: Add FanDuel NFL NBA MLB game lines
        continue-on-error: true
        run: python scripts/fanduel-direct.py
      - name: Add FanDuel NFL NBA MLB exact player props
        continue-on-error: true
        run: python scripts/fanduel-props-direct.py
      - name: Add DraftKings NFL exact two-sided player props
        continue-on-error: true
        run: python scripts/draftkings-nfl-direct.py
      - name: Add DraftKings NBA and MLB exact two-sided player props
        continue-on-error: true
        run: python scripts/draftkings-traditional-direct.py
      - name: Build loose direct discovery board
        run: node scripts/simple-direct-discovery.mjs
      - name: Merge direct sources into comparison board
        run: node scripts/merge-direct-sources.mjs
      - name: Exact safety screen
        run: node scripts/screen-thunderpick-ev.mjs
      - name: Verify exact NFL player-prop WATCH rows
        run: node scripts/simple-nfl-prop-watch.mjs
      - name: Verify exact two-source WATCH rows
        run: node scripts/simple-two-source-watch.mjs
      - name: Build simple discovery-first board
        run: node scripts/simple-opportunity-board.mjs
      - name: Run hard production coverage audit
        id: coverage_audit
        continue-on-error: true
        run: node scripts/audit-production-coverage.mjs
      - name: Retry degraded/failing collectors once and rebuild
        if: steps.coverage_audit.outcome == 'failure'
        run: |
          node scripts/direct-public-sources.mjs
          node scripts/kalshi-rate-limited.mjs
          node scripts/betway-direct.mjs
          node scripts/pinnacle-direct.mjs
          node scripts/pinnwire-direct.mjs || true
          node scripts/kambi-direct.mjs
          node scripts/kambi-traditional-direct.mjs
          node scripts/kambi-nfl-direct.mjs
          node scripts/bovada-nfl-direct.mjs
          node scripts/bovada-traditional-direct.mjs
          python scripts/fanduel-direct.py || true
          python scripts/fanduel-props-direct.py || true
          python scripts/draftkings-nfl-direct.py || true
          python scripts/draftkings-traditional-direct.py || true
          node scripts/simple-direct-discovery.mjs
          node scripts/merge-direct-sources.mjs
          node scripts/screen-thunderpick-ev.mjs
          node scripts/simple-nfl-prop-watch.mjs
          node scripts/simple-two-source-watch.mjs
          node scripts/simple-opportunity-board.mjs
      - name: Enforce production coverage gate
        run: node scripts/audit-production-coverage.mjs
      - name: Transactional publication validation
        run: node scripts/production-reliability.mjs validate-publication data/simple-opportunity-latest.json data/simple-opportunity-display-latest.json data/production-coverage-audit-latest.json
      - name: Write verified heartbeat
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          CODE_SHA: ${{ github.sha }}
          RECOVERY_REASON: ${{ needs.gate.outputs.reason }}
        run: |
          node - <<'NODE'
          const fs=require('fs'); const b=JSON.parse(fs.readFileSync('data/simple-opportunity-latest.json','utf8')); const a=JSON.parse(fs.readFileSync('data/production-coverage-audit-latest.json','utf8'));
          fs.writeFileSync('data/production-heartbeat-latest.json',JSON.stringify({status:'CURRENT',runId:process.env.RUN_ID,runAttempt:Number(process.env.RUN_ATTEMPT||1),codeSha:process.env.CODE_SHA,finishedAt:new Date().toISOString(),boardGeneratedAt:b.generatedAt,counts:b.counts,coverageStatus:a.status,recoveryReason:process.env.RECOVERY_REASON,publicationStatus:'VALIDATED',verificationStatus:'PENDING'},null,2));
          NODE
      - name: Publish simple board
        run: |
          git config user.name 'thunderpick-bot'; git config user.email 'actions@users.noreply.github.com'
          rm -rf /tmp/thunderpick-data; mkdir -p /tmp/thunderpick-data; cp -a data/. /tmp/thunderpick-data/
          node - <<'NODE'
          const fs=require('fs'); const p='/tmp/thunderpick-data/owls-latest.json'; if(fs.existsSync(p)){const j=JSON.parse(fs.readFileSync(p,'utf8')); for(const s of Object.values(j.sports||{})){const rows=s?.data?.data;if(Array.isArray(rows))s.data.data=rows.map(e=>({id:e.id,name:e.name,startTime:e.startTime,isLive:e.isLive,market:e.market,deepMarketsFetchedAt:e.deepMarketsFetchedAt,deepMarketsFresh:e.deepMarketsFresh,deepMarketsError:e.deepMarketsError,preferredMarketCount:Array.isArray(e.preferredMarkets)?e.preferredMarkets.length:0}));} j.publishedDiagnosticSummary=true;fs.writeFileSync(p,JSON.stringify(j));}
          NODE
          for n in 1 2 3; do git fetch origin main; git reset --hard origin/main; rm -rf data; mkdir -p data; cp -a /tmp/thunderpick-data/. data/; git add -A data/; if git diff --cached --quiet; then exit 0; fi; git commit -m 'Update simple Thunderpick opportunity board [skip ci]'; if git push origin HEAD:main; then exit 0; fi; sleep $((n*3)); done; exit 1
      - name: Verify published authoritative board
        run: |
          git fetch origin main
          node - <<'NODE'
          const fs=require('fs'),cp=require('child_process'); const local=JSON.parse(fs.readFileSync('/tmp/thunderpick-data/simple-opportunity-latest.json','utf8')); const remote=JSON.parse(cp.execFileSync('git',['show','origin/main:data/simple-opportunity-latest.json'],{encoding:'utf8'})); if(remote.generatedAt!==local.generatedAt)throw new Error(`published board mismatch local=${local.generatedAt} remote=${remote.generatedAt}`); const age=(Date.now()-Date.parse(remote.generatedAt))/60000;if(!Number.isFinite(age)||age>15)throw new Error(`published board is stale: ${remote.generatedAt}`); console.log('PUBLISH_VERIFIED',{generatedAt:remote.generatedAt,ageMin:age.toFixed(2),counts:remote.counts});
          NODE
