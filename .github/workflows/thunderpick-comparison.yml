name: Thunderpick Comparison Screen

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/owls-latest.json'
      - 'scripts/owls-comparison.mjs'
      - 'scripts/screen-thunderpick-ev.mjs'
      - '.github/workflows/thunderpick-comparison.yml'

permissions:
  contents: write

concurrency:
  group: thunderpick-comparison-screen
  cancel-in-progress: true

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch normalized outside esports boards
        env:
          OWLS_API_KEY: ${{ secrets.OWLS_API_KEY }}
        run: node scripts/owls-comparison.mjs
      - name: Screen Thunderpick against outside boards
        run: node scripts/screen-thunderpick-ev.mjs
      - name: Commit comparison and screen
        run: |
          cp data/owls-comparison-latest.json /tmp/owls-comparison-latest.json
          cp data/screen-latest.json /tmp/screen-latest.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/owls-comparison-latest.json data/owls-comparison-latest.json
          cp /tmp/screen-latest.json data/screen-latest.json
          git config user.name 'thunderpick-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/owls-comparison-latest.json data/screen-latest.json
          git diff --cached --quiet && exit 0
          git commit -m 'Update Thunderpick comparison screen [skip ci]'
          git push origin HEAD:main
