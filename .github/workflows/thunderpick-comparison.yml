name: Thunderpick Comparison Screen

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Thunderpick Owls Snapshot"]
    types: [completed]
  schedule:
    - cron: '14 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/owls-comparison.mjs'
      - 'scripts/propline-enrich.mjs'
      - 'scripts/screen-thunderpick-ev.mjs'
      - '.github/workflows/thunderpick-comparison.yml'

permissions:
  contents: write

concurrency:
  group: thunderpick-comparison-screen
  cancel-in-progress: true

jobs:
  screen:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch normalized outside boards
        env:
          OWLS_API_KEY: ${{ secrets.OWLS_API_KEY }}
        run: node scripts/owls-comparison.mjs
      - name: Add PropLine independent-book verification
        env:
          PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
        run: node scripts/propline-enrich.mjs
      - name: Normalize sports keys and enable all supported Thunderpick sports
        run: |
          node -e "const fs=require('fs');const p='data/owls-comparison-latest.json';const x=JSON.parse(fs.readFileSync(p));x.sports['american-football']=x.sports.nfl||{data:{}};x.sports.baseball=x.sports.mlb||{data:{}};x.sports.basketball=x.sports.nba||{data:{}};fs.writeFileSync(p,JSON.stringify(x,null,2));"
          python - <<'PY'
          p='scripts/screen-thunderpick-ev.mjs'
          s=open(p).read()
          s=s.replace("const SPORTS=['cs2','dota2','lol','valorant'];", "const SPORTS=['cs2','dota2','lol','valorant','american-football','baseball','basketball','soccer','tennis'];")
          # Do not reject legitimate pregame sports rows merely because providers use
          # 'upcoming'/'pregame'/other status labels instead of literal 'scheduled'.
          s=s.replace("if(e.status&&e.status!=='scheduled')continue;const k=pairKey(e.home_team,e.away_team);", "if(e.live===true||String(e.status||'').toLowerCase()==='live')continue;const k=pairKey(e.home_team,e.away_team);")
          # Player props must never be compared to generic game totals. Until an outside
          # market carries exact player identity, keep these out of verified EV/arb.
          s=s.replace("for(const m of e?.preferredMarkets||[]){const key=classifyMarket(m);", "for(const m of e?.preferredMarkets||[]){if(/\\bplayer\\b/i.test(`${m.nickName||''} ${m.name||''}`))continue;const key=classifyMarket(m);")
          open(p,'w').write(s)
          PY
      - name: Screen Thunderpick against outside boards
        run: node scripts/screen-thunderpick-ev.mjs
      - name: Validate sports coverage
        run: |
          node -e "const s=require('./data/screen-latest.json'); const required=['american-football','baseball','basketball','tennis']; for(const k of required){if(!(k in s.eligibleBySport)) throw new Error('missing sport '+k)}; console.log('SPORTS COVERAGE',s.eligibleBySport,s.matchedBySport);"
      - name: Commit comparison and screen
        run: |
          cp data/owls-comparison-latest.json /tmp/owls-comparison-latest.json
          cp data/screen-latest.json /tmp/screen-latest.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/owls-comparison-latest.json data/owls-comparison-latest.json
          cp /tmp/screen-latest.json data/screen-latest.json
          git config user.name 'thunderpick-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/owls-comparison-latest.json data/screen-latest.json
          git diff --cached --quiet && exit 0
          git commit -m 'Update Thunderpick comparison screen [skip ci]'
          git push origin HEAD:main
