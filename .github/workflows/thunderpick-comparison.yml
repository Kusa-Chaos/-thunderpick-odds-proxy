name: Thunderpick Comparison Screen (Legacy Manual)

# Legacy scanner retained only as a manual diagnostic marker.
# Scheduled production is handled exclusively by Thunderpick Simple Hourly Board.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy_notice:
    runs-on: ubuntu-latest
    steps:
      - name: Legacy scanner retired
        run: echo 'Legacy Thunderpick Comparison Screen is disabled. Use Thunderpick Simple Hourly Board.'
