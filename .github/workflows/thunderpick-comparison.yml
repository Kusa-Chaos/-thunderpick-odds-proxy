name: Thunderpick Comparison Screen

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Thunderpick Owls Snapshot"]
    types: [completed]
  schedule:
    - cron: '15 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/owls-comparison.mjs'
      - 'scripts/propline-enrich.mjs'
      - 'scripts/screen-thunderpick-ev.mjs'
      - 'data/owls-v2-access-probe.json'
      - '.github/workflows/thunderpick-comparison.yml'

permissions:
  contents: write

concurrency:
  group: thunderpick-comparison-screen
  cancel-in-progress: true

jobs:
  screen:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh Thunderpick board for this scan
        env:
          OWLS_API_KEY: ${{ secrets.OWLS_API_KEY }}
        run: node scripts/owls-thunderpick.mjs
      - name: Fetch normalized outside boards
        env:
          OWLS_API_KEY: ${{ secrets.OWLS_API_KEY }}
        run: node scripts/owls-comparison.mjs
      - name: Probe Owls v2 raw esports access
        env:
          OWLS_API_KEY: ${{ secrets.OWLS_API_KEY }}
        run: |
          node - <<'NODE'
          const fs=await import('node:fs');
          const key=(process.env.OWLS_API_KEY||'').trim();
          const base='https://api.owlsinsight.com/api/v2';
          async function get(path){
            try{const r=await fetch(base+path,{headers:{Authorization:'Bearer '+key,Accept:'application/json'},signal:AbortSignal.timeout(20000)});const text=await r.text();let body;try{body=JSON.parse(text)}catch{body={raw:text.slice(0,500)}};return {status:r.status,ok:r.ok,body};}catch(e){return {status:null,ok:false,error:String(e.message||e)}}
          }
          const out={generatedAt:new Date().toISOString(),tests:{}};
          for(const spec of [{book:'pinnacle',sport:'esports'},{book:'kalshi',sport:'cs2'},{book:'polymarket',sport:'cs2'}]){
            const {book,sport}=spec;
            const leagues=await get('/'+book+'/'+sport+'/leagues');
            out.tests[book]={leagues:{status:leagues.status,ok:leagues.ok}};
            const rows=leagues.body?.data||leagues.body?.leagues||leagues.body||{};
            let league=null;
            if(Array.isArray(rows)){
              const first=rows[0];
              league=typeof first==='string'?first:(first?.key||first?.slug||first?.leagueKey||first?.league_key||first?.id||first?.league||first?.tag||first?.value||first?.name||null);
            } else if(rows && typeof rows==='object') {
              const entries=Object.entries(rows).filter(([k])=>!['etag','timestamp','generatedAt','count','status'].includes(k));
              const first=entries[0];
              if(first){
                const [k,v]=first;
                league=(v&&typeof v==='object'&&(v.key||v.slug||v.leagueKey||v.league_key||v.id))||k;
              }
            }
            out.tests[book].leagueShape=Array.isArray(rows)?'array':typeof rows; out.tests[book].leaguePreview=Array.isArray(rows)?rows.slice(0,5):[];
            out.tests[book].leagueKeys=rows&&typeof rows==='object'?Object.keys(rows).slice(0,20):[];
            if(league){
              const board=await get('/'+book+'/'+sport+'?league='+encodeURIComponent(String(league)));
              out.tests[book].league=String(league);
              out.tests[book].board={status:board.status,ok:board.ok};
              if(board.ok){
                const raw=JSON.stringify(board.body);
                out.tests[book].hasMap=/map/i.test(raw);
                out.tests[book].hasRound=/round/i.test(raw);
                out.tests[book].hasTopics=/topics/i.test(raw);
                out.tests[book].sample=raw.slice(0,12000);
              }
            }
          }
          fs.writeFileSync('data/owls-v2-access-probe.json',JSON.stringify(out,null,2));
          console.log('OWLS_V2_PROBE',JSON.stringify(out.tests));
          NODE
      - name: Normalize OWLS sports aliases before enrichment
        run: |
          node - <<'NODE'
          const fs=require('fs'); const p='data/owls-comparison-latest.json'; const x=JSON.parse(fs.readFileSync(p)); x.sports ||= {};
          for(const [dst,src] of [['american-football','nfl'],['baseball','mlb'],['basketball','nba']]) if(!x.sports[dst]) x.sports[dst]=x.sports[src]||{ok:true,status:200,data:{}};
          fs.writeFileSync(p,JSON.stringify(x,null,2));
          NODE
      - name: Add PropLine independent-book verification
        env:
          PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
        run: node scripts/propline-enrich.mjs
      - name: Screen Thunderpick against outside boards
        run: node scripts/screen-thunderpick-ev.mjs
      - name: Build visible scan summary
        run: |
          node - <<'NODE'
          const fs=require('fs'); const s=JSON.parse(fs.readFileSync('data/screen-latest.json'));
          const esports=new Set(['cs2','dota2','lol','valorant']);
          const slim=(c,tier)=>{const a=c.thunderpick?.a,b=c.thunderpick?.b;if(!a||!b)return null;const side=Number(c.ev?.a)>=Number(c.ev?.b)?'a':'b';const pick=side==='a'?a:b;const ev=Number(side==='a'?c.ev?.a:c.ev?.b);return {tier,verificationTier:c.verificationTier||null,sport:c.sport,match:c.name,target:String(pick.name||''),market:c.marketLabel||c.marketKey,marketKey:c.marketKey||null,line:pick.point??null,scope:c.scope||null,thunderpick:Number(pick.odds),verifiedEV:ev,independentSources:Number(c.verifiedIndependentSources??c.verifiedIdentityDepth??0),outside:(c.outside||[]).slice(0,12),fair:c.fair||null,arbScreen:c.arbScreen||null,startTime:c.startTime,esports:esports.has(c.sport)};};
          const rank=(a,b)=>(Number(b.esports)-Number(a.esports))||(b.verifiedEV-a.verifiedEV)||(b.independentSources-a.independentSources);
          const actionRows=(s.actionCandidates||[]).map(c=>slim(c,'ACTION')).filter(Boolean).sort(rank);
          const watchRows=(s.watchCandidates||[]).map(c=>slim(c,'WATCH')).filter(Boolean).sort(rank);
          const potentialRows=(s.potentialCandidates||[]).map(c=>slim(c,'POTENTIAL')).filter(Boolean).sort(rank);
          // Never let high-EV low-source screens bury a verified 3-4 source WATCH.
          // Publish every ACTION/WATCH first, with genuine esports first on ties.
          const seen=new Set(); const rows=[];
          for(const r of [...actionRows,...watchRows,...potentialRows]){const k=[r.sport,r.match,r.target,r.market].join('|');if(seen.has(k))continue;seen.add(k);rows.push(r);}
          // Keep scan-display intentionally lightweight for GitHub/API readers. Detailed
          // source quotes remain in scan-report-latest.json and screen-latest.json.
          const displayRow=r=>({tier:r.tier,verificationTier:r.verificationTier,sport:r.sport,match:r.match,target:r.target,market:r.market,marketKey:r.marketKey,line:r.line,scope:r.scope,thunderpick:r.thunderpick,verifiedEV:r.verifiedEV,independentSources:r.independentSources,startTime:r.startTime});
          const out={generatedAt:s.generatedAt,thunderpickGeneratedAt:s.thunderpickGeneratedAt,comparisonGeneratedAt:s.comparisonGeneratedAt,coverage:{eligibleThunderpickEvents:s.eligibleThunderpickEvents,matchedEvents:s.matchedEvents,eligibleMarkets:s.eligibleMarkets,matchedMarkets:s.matchedMarkets,eligibleBySport:s.eligibleBySport,matchedBySport:s.matchedBySport,marketTypeCounts:s.marketTypeCounts,arbitrageMarketsTested:s.arbitrageMarketsTested},counts:{action:actionRows.length,watch:watchRows.length,potential:potentialRows.length},actionRows:actionRows.slice(0,20).map(displayRow),watchRows:watchRows.slice(0,30).map(displayRow),potentialRows:potentialRows.slice(0,30).map(displayRow),rows:rows.slice(0,100).map(displayRow),publication:{compact:true,detailArtifact:'data/scan-report-latest.json'}};
          fs.writeFileSync('data/scan-display-latest.json',JSON.stringify(out,null,2));
          // Fail loudly if the generated display artifact is unexpectedly empty.
          const displaySize=fs.statSync('data/scan-display-latest.json').size;
          if(displaySize<100) throw new Error('scan-display-latest.json unexpectedly empty: '+displaySize+' bytes');
          console.log('SCAN_DISPLAY_BYTES',displaySize);
          // Publish a deliberately small candidate artifact so chat/reporting clients
          // never need to parse the multi-megabyte screen file. Keep every source-tier
          // bucket visible, plus all current LoL rows for WSCI/EMEA inspection.
          const compactRow=r=>({tier:r.tier,verificationTier:r.verificationTier,sport:r.sport,match:r.match,target:r.target,market:r.market,marketKey:r.marketKey,line:r.line,scope:r.scope,thunderpick:r.thunderpick,verifiedEV:r.verifiedEV,independentSources:r.independentSources,outside:(r.outside||[]).slice(0,8),fair:r.fair,arbScreen:r.arbScreen,startTime:r.startTime});
          const lolRows=[...actionRows,...watchRows,...potentialRows].filter(r=>r.sport==='lol').map(compactRow);
          // Keep this file genuinely small/readable. Full tier counts remain in counts;
          // publish bounded top rows plus every LoL candidate for explicit WSCI/EMEA review.
          const topAction=actionRows.slice(0,20).map(compactRow);
          const topWatch=watchRows.slice(0,30).map(compactRow);
          const topPotential=potentialRows.slice(0,30).map(compactRow);
          const limitedProps=(s.limitedExactComparisons||[]).filter(r=>r.marketKey==='player_prop').slice(0,30);
          let semanticScreens=s.oneWayPlayerPropScreens||[];
          // Fallback audit path for one-way exact semantic props (e.g. MLB "to record a hit"
          // == TP hits Over 0.5). These are SCREENING only because there is no Under price to de-vig.
          if(!semanticScreens.length&&fs.existsSync('data/player-prop-schema.json')){
            const ps=JSON.parse(fs.readFileSync('data/player-prop-schema.json')).playerPropSchemaSamples||{};
            const outs=ps.outside||[];
            for(const t of ps.thunderpick||[]){
              const nm=String(t.name||''); const pm=nm.match(/^Player\s+(.+?)\s+-\s+Total\s+hits\b/i);
              if(!pm)continue; const player=pm[1].trim(); const over=(t.selections||[]).find(z=>/^over$/i.test(String(z.name||'')));
              const line=Number(over?.total??over?.point); if(line!==0.5)continue;
              for(const o of outs.filter(z=>z.sport===t.sport&&z.event===t.event&&/to_record_a_hit/i.test(String(z.key||'')))){
                const hit=(o.outcomes||[]).find(z=>String(z.name||'').toLowerCase()===player.toLowerCase()); if(!hit)continue;
                const raw=Number(hit.price); const price=raw>=100?1+raw/100:raw<=-100?1+100/Math.abs(raw):raw;
                if(!(price>1))continue;
                semanticScreens.push({tier:'SCREENING',sport:t.sport,match:t.event,target:player+' Over 0.5 hits',market:'Player total hits',marketKey:'player_prop',line:0.5,thunderpick:Number(over.odds),outsidePrice:price,book:o.book,independentSources:1,blocker:'one-way exact semantic price; no Under price for de-vig, SCREENING ONLY'});
              }
            }
          }
          const playerPropScreenRows=[...limitedProps,...semanticScreens].slice(0,30);
          const handicapRows=[...actionRows,...watchRows,...potentialRows].filter(r=>r.marketKey==='spreads'||r.marketKey==='round_handicap').slice(0,30).map(compactRow);
          out.coverage.rawExactQuoteMatchesByType=s.rawExactQuoteMatchesByType||{};
          const report={generatedAt:out.generatedAt,thunderpickGeneratedAt:out.thunderpickGeneratedAt,comparisonGeneratedAt:out.comparisonGeneratedAt,counts:{action:actionRows.length,watch:watchRows.length,potential:potentialRows.length,limitedPlayerProps:playerPropScreenRows.length,handicaps:handicapRows.length},published:{action:topAction.length,watch:topWatch.length,potential:topPotential.length,lol:lolRows.length,limitedPlayerProps:playerPropScreenRows.length,handicaps:handicapRows.length},coverage:out.coverage,actionRows:topAction,watchRows:topWatch,potentialRows:topPotential,lolRows,limitedPlayerPropRows:playerPropScreenRows,handicapRows};
          fs.writeFileSync('data/scan-report-latest.json',JSON.stringify(report,null,2));
          console.log('VISIBLE_ROWS',out.rows.length,'ACTION',actionRows.length,'WATCH',watchRows.length,'POTENTIAL',potentialRows.length,'REPORT_BYTES',fs.statSync('data/scan-report-latest.json').size,'LOL_ROWS',lolRows.length);
          NODE
      - name: Compact full screen for repository publication
        run: |
          node - <<'NODE'
          const fs=require('fs'); const p='data/screen-latest.json'; const s=JSON.parse(fs.readFileSync(p,'utf8'));
          const slim=c=>({...c,outside:Array.isArray(c.outside)?c.outside.slice(0,12):[]});
          const candidates=(s.candidates||[]).slice(0,100).map(slim);
          const arbScreens=(s.arbScreens||[]).slice(0,50).map(slim);
          const out={...s,candidates,arbScreens,publication:{compact:true,originalCandidateCount:(s.candidates||[]).length,publishedCandidateCount:candidates.length,originalArbScreenCount:(s.arbScreens||[]).length,publishedArbScreenCount:arbScreens.length,maxOutsideQuotesPerCandidate:12}};
          fs.writeFileSync(p,JSON.stringify(out,null,2));
          console.log('COMPACT_SCREEN_BYTES',fs.statSync(p).size,'CANDIDATES',candidates.length,'ARBS',arbScreens.length);
          NODE
      - name: Compact comparison for repository publication
        run: |
          node - <<'NODE'
          const fs=require('fs'); const p='data/owls-comparison-latest.json';
          const x=JSON.parse(fs.readFileSync(p,'utf8'));
          // Keep audit metadata plus a bounded sample of each sport/source. Full
          // comparison data is consumed by the screener before this step.
          function compact(v,depth=0){
            if(depth>7) return '[truncated]';
            if(Array.isArray(v)) return v.slice(0,60).map(x=>compact(x,depth+1));
            if(v&&typeof v==='object'){
              const o={}; for(const [k,val] of Object.entries(v)){
                if(['raw','html','body','responseText'].includes(k)) continue;
                o[k]=compact(val,depth+1);
              } return o;
            }
            return v;
          }
          const out=compact(x);
          out.publication={compact:true,purpose:'auditable comparison artifact; full board screened before compaction'};
          fs.writeFileSync(p,JSON.stringify(out,null,2));
          console.log('COMPACT_COMPARISON_BYTES',fs.statSync(p).size);
          NODE
      - name: Freshness gate
        run: |
          node - <<'NODE'
          const fs=require('fs'); const now=Date.now();
          // The Thunderpick snapshot is produced by the separate snapshot workflow.
          // Require it to be recent enough for screening, but don't fail this comparison
          // job merely because it is older than the freshly-generated comparison output.
          const limits={
            'data/owls-latest.json': 30*60*1000,
            'data/owls-meta.json': 30*60*1000,
            'data/owls-comparison-latest.json': 30*60*1000,
            'data/screen-latest.json': 30*60*1000
          };
          for(const [p,maxAge] of Object.entries(limits)) {
            if(!fs.existsSync(p)) throw new Error(p+' missing');
            const x=JSON.parse(fs.readFileSync(p,'utf8'));
            const ts=x.generatedAt || x.fetchedAt || x.updatedAt || x.timestamp || x.thunderpickGeneratedAt;
            if(!ts) throw new Error(p+' missing timestamp');
            const age=now-Date.parse(ts);
            if(!Number.isFinite(age)||age<0||age>maxAge) throw new Error(p+' stale: '+ts);
            console.log('FRESHNESS_OK',p,ts,Math.round(age/1000)+'s','limit='+Math.round(maxAge/60000)+'m');
          }
          NODE

      - name: Validate compact outputs before publish
        run: |
          node - <<'NODE'
          const fs=require('fs');
          for(const p of ['data/owls-comparison-latest.json','data/screen-latest.json','data/scan-display-latest.json','data/scan-report-latest.json','data/esports-derivative-schema.json','data/pinnacle-esports-derivative-debug.json']) {
            if(!fs.existsSync(p)) throw new Error(`${p} missing`);
            const st=fs.statSync(p); if(st.size<3) throw new Error(`${p} empty (${st.size} bytes)`);
            if(st.size>50*1024*1024) throw new Error(`${p} too large for compact publication (${st.size} bytes)`);
            const x=JSON.parse(fs.readFileSync(p,'utf8')); if(!x || typeof x!=='object') throw new Error(`${p} invalid JSON object`);
            if(p==='data/scan-display-latest.json' && st.size<100) throw new Error(`${p} unexpectedly empty (${st.size} bytes)`);
            console.log('VALID_OUTPUT',p,st.size,'bytes');
          }
          NODE
      - name: Commit compact fresh scan outputs
        run: |
          git config user.name 'thunderpick-bot'
          git config user.email 'actions@users.noreply.github.com'
          git restore scripts/screen-thunderpick-ev.mjs || true
          git add data/owls-v2-access-probe.json data/owls-latest.json data/owls-meta.json data/owls-comparison-latest.json data/screen-latest.json data/scan-display-latest.json data/scan-report-latest.json data/esports-derivative-schema.json data/player-prop-schema.json data/pinnacle-esports-derivative-debug.json data/player-props-latest.json
          git diff --cached --quiet && exit 0
          git commit -m 'Update Thunderpick compact comparison screen [skip ci]'
          git push origin HEAD:${GITHUB_REF_NAME}
