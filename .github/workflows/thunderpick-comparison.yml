name: Thunderpick Comparison Screen

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Thunderpick Owls Snapshot"]
    types: [completed]
  schedule:
    - cron: '43 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/owls-comparison.mjs'
      - 'scripts/propline-enrich.mjs'
      - 'scripts/screen-thunderpick-ev.mjs'
      - '.github/workflows/thunderpick-comparison.yml'

permissions:
  contents: write

concurrency:
  group: thunderpick-comparison-screen
  cancel-in-progress: true

jobs:
  screen:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh Thunderpick board for this scan
        env:
          OWLS_API_KEY: ${{ secrets.OWLS_API_KEY }}
        run: node scripts/owls-thunderpick.mjs
      - name: Fetch normalized outside boards
        env:
          OWLS_API_KEY: ${{ secrets.OWLS_API_KEY }}
        run: node scripts/owls-comparison.mjs
      - name: Normalize OWLS sports aliases before enrichment
        run: |
          node - <<'NODE'
          const fs=require('fs'); const p='data/owls-comparison-latest.json'; const x=JSON.parse(fs.readFileSync(p)); x.sports ||= {};
          for(const [dst,src] of [['american-football','nfl'],['baseball','mlb'],['basketball','nba']]) if(!x.sports[dst]) x.sports[dst]=x.sports[src]||{ok:true,status:200,data:{}};
          fs.writeFileSync(p,JSON.stringify(x,null,2));
          NODE
      - name: Add PropLine independent-book verification
        env:
          PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
        run: node scripts/propline-enrich.mjs
      - name: Enable supported sports in scanner
        run: |
          python - <<'PY'
          p='scripts/screen-thunderpick-ev.mjs'; s=open(p).read()
          s=s.replace("const SPORTS=['cs2','dota2','lol','valorant'];", "const SPORTS=['cs2','dota2','lol','valorant','american-football','baseball','basketball','soccer','tennis'];")
          old="function outsideEvents(sport){const data=cmp?.sports?.[sport]?.data||{};const out=[];for(const [book,events] of Object.entries(data)){if(Array.isArray(events))for(const e of events)out.push({book,event:e});}return out;}"
          new="function outsideEvents(sport){const data=cmp?.sports?.[sport]?.data;const out=[];const seen=new Set();function walk(v,bookHint='owls'){if(!v)return;if(Array.isArray(v)){for(const x of v)walk(x,bookHint);return;}if(typeof v!=='object')return;if(v.home_team&&v.away_team&&Array.isArray(v.bookmakers)){const id=String(v.id||v.eventId||`${v.home_team}|${v.away_team}|${v.commence_time||''}`);const books=v.bookmakers.length?v.bookmakers:[{key:bookHint}];for(const bm of books){const key=`${id}|${bm.key||bm.title||bookHint}`;if(seen.has(key))continue;seen.add(key);out.push({book:bm.key||bm.title||bookHint,event:{...v,bookmakers:[bm]}});}return;}for(const [k,x] of Object.entries(v))walk(x,k||bookHint);}walk(data);return out;}"
          if old not in s: raise SystemExit('outsideEvents signature not found')
          s=s.replace(old,new)
          s=s.replace("if(e.status&&e.status!=='scheduled')continue;const k=pairKey(e.home_team,e.away_team);", "if(e.live===true||String(e.status||'').toLowerCase()==='live')continue;const k=pairKey(e.home_team,e.away_team);")
          s=s.replace("for(const m of e?.preferredMarkets||[]){const key=classifyMarket(m);", "for(const m of e?.preferredMarkets||[]){if(/\\bplayer\\b/i.test(`${m.nickName||''} ${m.name||''}`))continue;const key=classifyMarket(m);")
          open(p,'w').write(s)
          PY
      - name: Screen Thunderpick against outside boards
        run: node scripts/screen-thunderpick-ev.mjs
      - name: Build visible scan summary
        run: |
          node - <<'NODE'
          const fs=require('fs'); const s=JSON.parse(fs.readFileSync('data/screen-latest.json'));
          const rows=[];
          for(const c of s.candidates||[]){const a=c.thunderpick?.a,b=c.thunderpick?.b;if(!a||!b)continue;const side=Number(c.ev?.a)>=Number(c.ev?.b)?'a':'b';const pick=side==='a'?a:b;const ev=Number(side==='a'?c.ev?.a:c.ev?.b);if(ev<.0025)continue;rows.push({sport:c.sport,match:c.name,target:String(pick.name||''),market:c.marketLabel||c.marketKey,thunderpick:Number(pick.odds),verifiedEV:ev,independentSources:Number(c.verifiedIdentityDepth||0),startTime:c.startTime});}
          const out={generatedAt:s.generatedAt,thunderpickGeneratedAt:s.thunderpickGeneratedAt,comparisonGeneratedAt:s.comparisonGeneratedAt,coverage:{eligibleThunderpickEvents:s.eligibleThunderpickEvents,matchedEvents:s.matchedEvents,eligibleMarkets:s.eligibleMarkets,matchedMarkets:s.matchedMarkets,eligibleBySport:s.eligibleBySport,matchedBySport:s.matchedBySport,marketTypeCounts:s.marketTypeCounts,arbitrageMarketsTested:s.arbitrageMarketsTested},rows:rows.slice(0,20)};
          fs.writeFileSync('data/scan-display-latest.json',JSON.stringify(out,null,2)); console.log('VISIBLE_ROWS',out.rows.length);
          NODE
      - name: Compact full screen for repository publication
        run: |
          node - <<'NODE'
          const fs=require('fs'); const p='data/screen-latest.json'; const s=JSON.parse(fs.readFileSync(p,'utf8'));
          const slim=c=>({...c,outside:Array.isArray(c.outside)?c.outside.slice(0,12):[]});
          const candidates=(s.candidates||[]).slice(0,100).map(slim);
          const arbScreens=(s.arbScreens||[]).slice(0,50).map(slim);
          const out={...s,candidates,arbScreens,publication:{compact:true,originalCandidateCount:(s.candidates||[]).length,publishedCandidateCount:candidates.length,originalArbScreenCount:(s.arbScreens||[]).length,publishedArbScreenCount:arbScreens.length,maxOutsideQuotesPerCandidate:12}};
          fs.writeFileSync(p,JSON.stringify(out,null,2));
          console.log('COMPACT_SCREEN_BYTES',fs.statSync(p).size,'CANDIDATES',candidates.length,'ARBS',arbScreens.length);
          NODE
      - name: Freshness gate
        run: |
          node - <<'NODE'
          const fs=require('fs'); const now=Date.now();
          // The Thunderpick snapshot is produced by the separate snapshot workflow.
          // Require it to be recent enough for screening, but don't fail this comparison
          // job merely because it is older than the freshly-generated comparison output.
          const limits={
            'data/owls-latest.json': 30*60*1000,
            'data/owls-meta.json': 30*60*1000,
            'data/owls-comparison-latest.json': 30*60*1000,
            'data/screen-latest.json': 30*60*1000
          };
          for(const [p,maxAge] of Object.entries(limits)) {
            if(!fs.existsSync(p)) throw new Error(p+' missing');
            const x=JSON.parse(fs.readFileSync(p,'utf8'));
            const ts=x.generatedAt || x.fetchedAt || x.updatedAt || x.timestamp || x.thunderpickGeneratedAt;
            if(!ts) throw new Error(p+' missing timestamp');
            const age=now-Date.parse(ts);
            if(!Number.isFinite(age)||age<0||age>maxAge) throw new Error(p+' stale: '+ts);
            console.log('FRESHNESS_OK',p,ts,Math.round(age/1000)+'s','limit='+Math.round(maxAge/60000)+'m');
          }
          NODE

      - name: Validate compact outputs before publish
        run: |
          node - <<'NODE'
          const fs=require('fs');
          for(const p of ['data/screen-latest.json','data/scan-display-latest.json','data/esports-derivative-schema.json','data/pinnacle-esports-derivative-debug.json']) {
            if(!fs.existsSync(p)) throw new Error(`${p} missing`);
            const st=fs.statSync(p); if(st.size<3) throw new Error(`${p} empty (${st.size} bytes)`);
            if(st.size>50*1024*1024) throw new Error(`${p} too large for compact publication (${st.size} bytes)`);
            const x=JSON.parse(fs.readFileSync(p,'utf8')); if(!x || typeof x!=='object') throw new Error(`${p} invalid JSON object`);
            console.log('VALID_OUTPUT',p,st.size,'bytes');
          }
          NODE
      - name: Commit compact fresh scan outputs
        run: |
          git config user.name 'thunderpick-bot'
          git config user.email 'actions@users.noreply.github.com'
          git restore scripts/screen-thunderpick-ev.mjs || true
          git add data/owls-latest.json data/owls-meta.json data/owls-comparison-latest.json data/screen-latest.json data/scan-display-latest.json data/esports-derivative-schema.json data/pinnacle-esports-derivative-debug.json
          git diff --cached --quiet && exit 0
          git commit -m 'Update Thunderpick compact comparison screen [skip ci]'
          git push origin HEAD:${GITHUB_REF_NAME}
