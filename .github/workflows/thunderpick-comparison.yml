name: Thunderpick Comparison Screen

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Thunderpick Owls Snapshot"]
    types: [completed]
  schedule:
    - cron: '14 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/owls-comparison.mjs'
      - 'scripts/propline-enrich.mjs'
      - 'scripts/screen-thunderpick-ev.mjs'
      - '.github/workflows/thunderpick-comparison.yml'

permissions:
  contents: write

concurrency:
  group: thunderpick-comparison-screen
  cancel-in-progress: true

jobs:
  screen:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch normalized outside boards
        env:
          OWLS_API_KEY: ${{ secrets.OWLS_API_KEY }}
        run: node scripts/owls-comparison.mjs
      - name: Normalize OWLS sports aliases before enrichment
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='data/owls-comparison-latest.json';
          const x=JSON.parse(fs.readFileSync(p));
          x.sports ||= {};
          for(const [dst,src] of [['american-football','nfl'],['baseball','mlb'],['basketball','nba']]) {
            if(!x.sports[dst]) x.sports[dst]=x.sports[src]||{ok:true,status:200,data:{}};
          }
          fs.writeFileSync(p,JSON.stringify(x,null,2));
          NODE
      - name: Add PropLine independent-book verification
        env:
          PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
        run: node scripts/propline-enrich.mjs
      - name: Enable supported sports in scanner
        run: |
          python - <<'PY'
          p='scripts/screen-thunderpick-ev.mjs'
          s=open(p).read()
          s=s.replace("const SPORTS=['cs2','dota2','lol','valorant'];", "const SPORTS=['cs2','dota2','lol','valorant','american-football','baseball','basketball','soccer','tennis'];")
          old="function outsideEvents(sport){const data=cmp?.sports?.[sport]?.data||{};const out=[];for(const [book,events] of Object.entries(data)){if(Array.isArray(events))for(const e of events)out.push({book,event:e});}return out;}"
          new="function outsideEvents(sport){const data=cmp?.sports?.[sport]?.data;const out=[];const seen=new Set();function walk(v,bookHint='owls'){if(!v)return;if(Array.isArray(v)){for(const x of v)walk(x,bookHint);return;}if(typeof v!=='object')return;if(v.home_team&&v.away_team&&Array.isArray(v.bookmakers)){const id=String(v.id||v.eventId||`${v.home_team}|${v.away_team}|${v.commence_time||''}`);const books=v.bookmakers.length?v.bookmakers:[{key:bookHint}];for(const bm of books){const key=`${id}|${bm.key||bm.title||bookHint}`;if(seen.has(key))continue;seen.add(key);out.push({book:bm.key||bm.title||bookHint,event:{...v,bookmakers:[bm]}});}return;}for(const [k,x] of Object.entries(v))walk(x,k||bookHint);}walk(data);return out;}"
          if old not in s: raise SystemExit('outsideEvents signature not found')
          s=s.replace(old,new)
          s=s.replace("if(e.status&&e.status!=='scheduled')continue;const k=pairKey(e.home_team,e.away_team);", "if(e.live===true||String(e.status||'').toLowerCase()==='live')continue;const k=pairKey(e.home_team,e.away_team);")
          s=s.replace("for(const m of e?.preferredMarkets||[]){const key=classifyMarket(m);", "for(const m of e?.preferredMarkets||[]){if(/\\bplayer\\b/i.test(`${m.nickName||''} ${m.name||''}`))continue;const key=classifyMarket(m);")
          open(p,'w').write(s)
          PY
      - name: Screen Thunderpick against outside boards
        run: node scripts/screen-thunderpick-ev.mjs
      - name: Validate sports coverage
        run: |
          node - <<'NODE'
          const s=require('./data/screen-latest.json');
          const required=['american-football','baseball','basketball','tennis'];
          for(const k of required) {
            if(!(k in s.eligibleBySport)) throw new Error('missing sport '+k);
            const eligible=s.eligibleBySport[k]||0, matched=s.matchedBySport[k]||0;
            if(eligible>0 && matched===0) throw new Error(`${k} matcher broken: ${eligible} eligible but 0 matched`);
          }
          console.log('SPORTS COVERAGE',s.eligibleBySport,s.matchedBySport);
          NODE
      - name: Commit comparison and screen
        run: |
          git config user.name 'thunderpick-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/owls-comparison-latest.json data/screen-latest.json
          git diff --cached --quiet && exit 0
          git commit -m 'Update Thunderpick comparison screen [skip ci]'
          git push origin HEAD:${GITHUB_REF_NAME}
