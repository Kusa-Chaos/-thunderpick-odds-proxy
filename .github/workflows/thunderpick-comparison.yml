name: Thunderpick Comparison Screen

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Thunderpick Owls Snapshot"]
    types: [completed]
  schedule:
    - cron: '14 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/owls-comparison.mjs'
      - 'scripts/propline-enrich.mjs'
      - 'scripts/screen-thunderpick-ev.mjs'
      - '.github/workflows/thunderpick-comparison.yml'

permissions:
  contents: write

concurrency:
  group: thunderpick-comparison-screen
  cancel-in-progress: true

jobs:
  screen:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch normalized outside boards
        env:
          OWLS_API_KEY: ${{ secrets.OWLS_API_KEY }}
        run: node scripts/owls-comparison.mjs
      - name: Normalize OWLS sports aliases before enrichment
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='data/owls-comparison-latest.json';
          const x=JSON.parse(fs.readFileSync(p));
          x.sports ||= {};
          for(const [dst,src] of [['american-football','nfl'],['baseball','mlb'],['basketball','nba']]) {
            if(!x.sports[dst]) x.sports[dst]=x.sports[src]||{ok:true,status:200,data:{}};
          }
          fs.writeFileSync(p,JSON.stringify(x,null,2));
          NODE
      - name: Add PropLine independent-book verification
        env:
          PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
        run: node scripts/propline-enrich.mjs
      - name: Enable supported sports in scanner
        run: |
          python - <<'PY'
          p='scripts/screen-thunderpick-ev.mjs'
          s=open(p).read()
          s=s.replace("const SPORTS=['cs2','dota2','lol','valorant'];", "const SPORTS=['cs2','dota2','lol','valorant','american-football','baseball','basketball','soccer','tennis'];")
          old="function outsideEvents(sport){const data=cmp?.sports?.[sport]?.data||{};const out=[];for(const [book,events] of Object.entries(data)){if(Array.isArray(events))for(const e of events)out.push({book,event:e});}return out;}"
          new="function outsideEvents(sport){const data=cmp?.sports?.[sport]?.data;const out=[];const seen=new Set();function walk(v,bookHint='owls'){if(!v)return;if(Array.isArray(v)){for(const x of v)walk(x,bookHint);return;}if(typeof v!=='object')return;if(v.home_team&&v.away_team&&Array.isArray(v.bookmakers)){const id=String(v.id||v.eventId||`${v.home_team}|${v.away_team}|${v.commence_time||''}`);const books=v.bookmakers.length?v.bookmakers:[{key:bookHint}];for(const bm of books){const key=`${id}|${bm.key||bm.title||bookHint}`;if(seen.has(key))continue;seen.add(key);out.push({book:bm.key||bm.title||bookHint,event:{...v,bookmakers:[bm]}});}return;}for(const [k,x] of Object.entries(v))walk(x,k||bookHint);}walk(data);return out;}"
          if old not in s: raise SystemExit('outsideEvents signature not found')
          s=s.replace(old,new)
          s=s.replace("if(e.status&&e.status!=='scheduled')continue;const k=pairKey(e.home_team,e.away_team);", "if(e.live===true||String(e.status||'').toLowerCase()==='live')continue;const k=pairKey(e.home_team,e.away_team);")
          s=s.replace("for(const m of e?.preferredMarkets||[]){const key=classifyMarket(m);", "for(const m of e?.preferredMarkets||[]){if(/\\bplayer\\b/i.test(`${m.nickName||''} ${m.name||''}`))continue;const key=classifyMarket(m);")
          open(p,'w').write(s)
          PY
      - name: Screen Thunderpick against outside boards
        run: node scripts/screen-thunderpick-ev.mjs
      - name: Build visible scan summary
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=JSON.parse(fs.readFileSync('data/screen-latest.json'));
          const hidden=/\b(MOUZ\s*(?:vs|v)\s*NRG|NRG\s*(?:vs|v)\s*MOUZ|Top Esports\s*(?:vs|v)\s*Invictus Gaming|Invictus Gaming\s*(?:vs|v)\s*Top Esports|TES\s*(?:vs|v)\s*IG|IG\s*(?:vs|v)\s*TES)\b/i;
          const rows=[];
          for(const c of s.candidates||[]){
            if(hidden.test(String(c.name||''))) continue;
            const a=c.thunderpick?.a,b=c.thunderpick?.b;
            if(!a||!b) continue;
            const side=(Number(c.ev?.a)>=Number(c.ev?.b))?'a':'b';
            const pick=side==='a'?a:b;
            const ev=Number(side==='a'?c.ev?.a:c.ev?.b);
            const fair=Number(side==='a'?c.fair?.aOdds:c.fair?.bOdds);
            const books=[...new Set((c.outside||[]).map(x=>x.book).filter(Boolean))];
            const outsidePrices=(c.outside||[]).map(q=>({book:q.book,price:Number(side==='a'?q.a:q.b),identityVerified:q.identityVerified!==false})).filter(x=>x.price>1);
            const best=outsidePrices.sort((x,y)=>y.price-x.price)[0]||null;
            const arb=c.identityVerified?c.arbScreen:null;
            let status='⚪ PASS';
            if(arb?.trueArb||arb?.nearArb) status='🟡 ARB WATCH';
            else if(ev>=0.02 && Number(c.verifiedIdentityDepth||0)>=10) status='🟢 +EV ACTION';
            else if(ev>=0.01 && Number(c.verifiedIdentityDepth||0)>=3) status='🟡 +EV WATCH';
            else if(ev>=0.0025) status='👀 SCREENING';
            if(status==='⚪ PASS') continue;
            rows.push({
              status,sport:c.sport,match:c.name,target:String(pick.name||'').toUpperCase(),market:c.marketLabel||c.marketKey,
              thunderpick:Number(pick.odds),bestOutside:best,independentSources:books.length,vigFreeFair:fair,
              verifiedEV:ev,arbGrossROI:Number(arb?.grossRoi),arbTrue:Boolean(arb?.trueArb),arbNear:Boolean(arb?.nearArb),
              verifiedIdentityDepth:Number(c.verifiedIdentityDepth||0),startTime:c.startTime
            });
          }
          const rank={'🟢 ARB ACTION':0,'🟢 +EV ACTION':1,'🟡 ARB WATCH':2,'🟡 +EV WATCH':3,'👀 SCREENING':4,'⚪ PASS':5};
          rows.sort((x,y)=>(rank[x.status]-rank[y.status])||((y.arbGrossROI||-9)-(x.arbGrossROI||-9))||(y.verifiedEV-x.verifiedEV));
          const out={generatedAt:s.generatedAt,thunderpickGeneratedAt:s.thunderpickGeneratedAt,comparisonGeneratedAt:s.comparisonGeneratedAt,
            coverage:{eligibleThunderpickEvents:s.eligibleThunderpickEvents,matchedEvents:s.matchedEvents,eligibleMarkets:s.eligibleMarkets,matchedMarkets:s.matchedMarkets,
              eligibleBySport:s.eligibleBySport,matchedBySport:s.matchedBySport,marketTypeCounts:s.marketTypeCounts,arbitrageMarketsTested:s.arbitrageMarketsTested},
            rows:rows.slice(0,20)};
          fs.writeFileSync('data/scan-display-latest.json',JSON.stringify(out,null,2));
          console.log('VISIBLE_ROWS',out.rows.length);
          NODE
      - name: Commit fresh scan output
        run: |
          git config user.name 'thunderpick-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/owls-comparison-latest.json data/screen-latest.json data/scan-display-latest.json
          git diff --cached --quiet && exit 0
          git commit -m 'Update Thunderpick comparison screen [skip ci]'
          git pull --rebase origin ${GITHUB_REF_NAME}
          git push origin HEAD:${GITHUB_REF_NAME}
      - name: Validate sports coverage
        continue-on-error: true
        run: |
          node - <<'NODE'
          const s=require('./data/screen-latest.json');
          const c=require('./data/owls-comparison-latest.json');
          const required=['american-football','baseball','basketball','tennis'];
          for(const k of required) {
            if(!(k in s.eligibleBySport)) throw new Error('missing sport '+k);
            const eligible=s.eligibleBySport[k]||0, matched=s.matchedBySport[k]||0;
            const relevant=(c.propline?.feeds||[]).filter(f =>
              (k==='american-football' && /football/.test(f.feed)) ||
              (k==='baseball' && /baseball/.test(f.feed)) ||
              (k==='basketball' && /basketball/.test(f.feed)) ||
              (k==='tennis' && f.feed==='tennis')
            ).reduce((n,f)=>n+(f.matchedEvents||0),0);
            if(eligible>0 && relevant>0 && matched===0) throw new Error(`${k} downstream matcher broken: ${eligible} eligible, ${relevant} enriched overlaps, 0 final matched`);
          }
          console.log('SPORTS COVERAGE',s.eligibleBySport,s.matchedBySport);
          NODE
