name: Esports Frontend API Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/esports-frontend-api-probe.py'
      - '.github/workflows/esports-frontend-api-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install TLS client
        run: pip install --disable-pip-version-check 'curl_cffi==0.16.3'
      - name: Discover public frontend API endpoints
        run: python scripts/esports-frontend-api-probe.py
