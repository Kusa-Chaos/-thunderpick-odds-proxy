name: Thunderpick Owls Snapshot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/owls-thunderpick.mjs'
      - '.github/workflows/thunderpick-owls.yml'

permissions:
  contents: write

concurrency:
  group: thunderpick-owls-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch Thunderpick board through Owls
        env:
          OWLS_API_KEY: ${{ secrets.OWLS_API_KEY }}
        run: node scripts/owls-thunderpick.mjs
      - name: Validate snapshot outputs
        run: |
          node - <<'NODE'
          const fs=require('fs');
          for(const p of ['data/owls-latest.json','data/owls-meta.json']) {
            if(!fs.existsSync(p)) throw new Error(p+' missing');
            const st=fs.statSync(p); if(st.size<3) throw new Error(p+' empty');
            JSON.parse(fs.readFileSync(p,'utf8'));
            console.log('VALID_OUTPUT',p,st.size,'bytes');
          }
          NODE
      - name: Commit fresh snapshot
        run: |
          git config user.name 'thunderpick-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/owls-latest.json data/owls-meta.json
          git diff --cached --quiet && exit 0
          git commit -m 'Update Thunderpick Owls snapshot [skip ci]'
          git push origin HEAD:${GITHUB_REF_NAME}
