name: Provision PinnWire Key to AWS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pinnwire-aws-secret-sync.yml'

permissions:
  id-token: write
  contents: read

concurrency:
  group: pinnwire-aws-secret-sync
  cancel-in-progress: false

jobs:
  sync-encrypted-pinnwire-credential:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Obtain scoped AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-2
          role-to-assume: arn:aws:iam::367398820205:role/ThunderpickPinnwireSecretSyncRole
          role-session-name: ThunderpickPinnwireSecretSync
      - name: Sync existing key into encrypted AWS SSM parameter
        env:
          PINNWIRE_API_KEY: ${{ secrets.PINNWIRE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${PINNWIRE_API_KEY:-}" ]]; then
            echo "::error::PINNWIRE_API_KEY secret is not configured in GitHub"
            exit 1
          fi
          aws ssm put-parameter \
            --name /thunderpick/pinnwire-api-key \
            --type SecureString \
            --value "$PINNWIRE_API_KEY" \
            --overwrite \
            --query Version \
            --output text
          echo "PinnWire key securely synced to AWS SSM; secret value not logged"
