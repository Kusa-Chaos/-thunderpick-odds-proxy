name: Thunderpick Hourly Production Watchdog

on:
  schedule:
    # GitHub scheduled events can be delayed or occasionally skipped under load.
    # Run the cheap freshness gate every 10 minutes so one missed cron does not
    # leave the authoritative board stale. The gate below prevents duplicate scans.
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: thunderpick-hourly-watchdog
  cancel-in-progress: false

jobs:
  ensure-production-run:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure a fresh verified production board exists
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET_WORKFLOW: thunderpick-simple-hourly.yml
        run: |
          set -euo pipefail
          now=$(date -u +%s)
          runs=$(gh api "repos/$REPO/actions/workflows/$TARGET_WORKFLOW/runs?branch=main&per_page=10")

          active=$(echo "$runs" | jq -r '[.workflow_runs[] | select(.status=="queued" or .status=="in_progress")] | length')
          if [ "$active" -gt 0 ]; then
            echo "Production run already active; watchdog will not stack a duplicate."
            exit 0
          fi

          # Freshness is defined by the published authoritative board itself, not by
          # workflow updated_at. A recently completed workflow must never make an old
          # board look fresh.
          board=$(gh api -H 'Accept: application/vnd.github.raw+json' "repos/$REPO/contents/data/simple-opportunity-latest.json?ref=main" 2>/dev/null || true)
          generated_at=$(printf '%s' "$board" | jq -r '.generatedAt // empty' 2>/dev/null || true)
          board_age=999999
          if [ -n "$generated_at" ]; then
            board_ts=$(date -u -d "$generated_at" +%s 2>/dev/null || echo 0)
            if [ "$board_ts" -gt 0 ] && [ "$board_ts" -le "$now" ]; then
              board_age=$(( (now-board_ts)/60 ))
            fi
          fi

          # Keep the board under 50 minutes old. With the 10-minute watchdog cadence,
          # a missed :40/:50 production schedule gets another GitHub-side recovery
          # opportunity before the :05 delivery window, without causing routine
          # duplicate scans when the normal :40 production cycle succeeds.
          latest_success=$(echo "$runs" | jq -r '[.workflow_runs[] | select(.status=="completed" and .conclusion=="success")][0].id // empty')
          if [ -n "$latest_success" ] && [ "$board_age" -le 50 ]; then
            echo "Fresh authoritative board exists (${board_age}m old; generatedAt=${generated_at}; successful run=${latest_success}); watchdog recovery not needed."
            exit 0
          fi

          echo "No fresh verified authoritative board (generatedAt=${generated_at:-missing}; age=${board_age}m; latest_success=${latest_success:-none}); dispatching one current-main recovery scan."
          before_ids=$(echo "$runs" | jq -r '.workflow_runs[].id' | tr '\n' ' ')
          gh workflow run "$TARGET_WORKFLOW" --repo "$REPO" --ref main

          accepted_id=''
          for attempt in 1 2 3 4 5 6; do
            sleep 3
            verify=$(gh api "repos/$REPO/actions/workflows/$TARGET_WORKFLOW/runs?branch=main&per_page=10")
            accepted_id=$(echo "$verify" | jq -r --arg before "$before_ids" '[.workflow_runs[] | select(.event=="workflow_dispatch") | select(($before | split(" ") | index((.id|tostring))) == null) | select(.status=="queued" or .status=="in_progress" or .status=="completed")][0].id // empty')
            if [ -n "$accepted_id" ]; then break; fi
          done
          if [ -z "$accepted_id" ]; then
            echo "ERROR: production workflow dispatch was not observed after watchdog request."
            exit 1
          fi
          echo "Production workflow dispatch accepted by GitHub: run_id=${accepted_id}."
