name: Owls V1 Thunderpick Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/owls-v1-test.mjs'
      - '.github/workflows/owls-v1-test.yml'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test unified odds and Thunderpick EV
        env:
          OWLS_API_KEY: ${{ secrets.OWLS_API_KEY }}
        run: node scripts/owls-v1-test.mjs
      - name: Commit test output
        run: |
          git config user.name 'thunderpick-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/owls-v1-test.json
          git commit -m 'Update Owls v1 test [skip ci]' || exit 0
          git push
