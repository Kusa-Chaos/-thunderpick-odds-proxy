name: AWS Secret Presence Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aws-secret-presence-probe.yml'

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check configured AWS deployment inputs
        env:
          AWS_ACCESS_KEY_ID_VALUE: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY_VALUE: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ROLE_ARN_VALUE: ${{ secrets.AWS_ROLE_ARN }}
          AWS_REGION_VALUE: ${{ secrets.AWS_REGION }}
          AWS_DEFAULT_REGION_VALUE: ${{ secrets.AWS_DEFAULT_REGION }}
        run: |
          test -n "$AWS_ACCESS_KEY_ID_VALUE" && A=yes || A=no
          test -n "$AWS_SECRET_ACCESS_KEY_VALUE" && S=yes || S=no
          test -n "$AWS_ROLE_ARN_VALUE" && R=yes || R=no
          test -n "$AWS_REGION_VALUE" && G=yes || G=no
          test -n "$AWS_DEFAULT_REGION_VALUE" && D=yes || D=no
          echo "AWS_SECRET_PRESENCE access_key=$A secret_key=$S role_arn=$R region=$G default_region=$D"

