name: Qualify Third Independent Esports Source

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/third-source-qualification.yml'

permissions:
  contents: read

concurrency:
  group: independent-esports-source-qualifier
  cancel-in-progress: false

jobs:
  check-existing-access:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check existing keys with at most one esports odds sample per provider
        env:
          ODDSPAPI_API_KEY: ${{ secrets.ODDSPAPI_API_KEY }}
          ODDS_API_IO_KEY: ${{ secrets.ODDS_API_IO_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {readOddsPapiEntitlement,canonicalBookmakerFamily} from './scripts/third-source-eligibility.mjs';
          const keyP=(process.env.ODDSPAPI_API_KEY||'').trim(), keyI=(process.env.ODDS_API_IO_KEY||process.env.ODDS_API_KEY||'').trim();
          const clean=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');
          const family=s=>{s=clean(s);if(s.includes('pinnacle')||s.includes('pinnwire'))return 'pinnacle';if(s.includes('stake')||s.includes('oddin'))return 'stake-oddin';if(s.includes('ggbet'))return 'ggbet';if(s.includes('unibet')||s.includes('kambi'))return 'unibet-kambi';return s;};
          if(family('PinnWire')!=='pinnacle'||family('Oddin Stake')!=='stake-oddin'||family('Unibet')!=='unibet-kambi')throw Error('source family regression');
          const qualified=(obj={})=>{const b=obj.bookmakerOdds||obj.bookmakers||obj.odds||{};const names=Object.keys(b);const targets=['bet365','1xbet','betano','rivalry','roobet','unibet-kambi'];const choices={};for(const [slug,v] of Object.entries(b)){const fam=canonicalBookmakerFamily(slug);if(!targets.includes(fam))continue;const markets=v?.markets||{};const ids=Object.keys(markets);if(!choices[fam]||slug.toLowerCase().replace(/[^a-z0-9]/g,'')===fam.replace(/[^a-z0-9]/g,'')){const m=markets[ids[0]]||{};const oi=Object.keys(m.outcomes||{});choices[fam]={book:slug,marketCount:ids.length,marketIds:ids.slice(0,8),exampleOutcomeIds:oi.slice(0,4),exampleOutcomePlayerIds:Object.keys(m.outcomes?.[oi[0]]?.players||{}).slice(0,4)};}}return {books:names.length,eligibleFamilies:Object.keys(choices).sort(),bookSamples:choices,exactSelectionsVerified:false};};
          async function get(root,path,key,query={}){const u=new URL(root+path);u.searchParams.set('apiKey',key);for(const [k,v] of Object.entries(query))u.searchParams.set(k,String(v));try{const r=await fetch(u,{signal:AbortSignal.timeout(20000),headers:{Accept:'application/json'}});const body=await r.json().catch(()=>null);return {ok:r.ok,status:r.status,body};}catch(e){return {ok:false,status:null,err:String(e.name)}}}
          const rows=v=>Array.isArray(v)?v:Array.isArray(v?.data)?v.data:Array.isArray(v?.events)?v.events:Array.isArray(v?.fixtures)?v.fixtures:[];
          async function papi(){if(!keyP)return {state:'NO_CONFIGURED_KEY'};const base='https://api.oddspapi.io/v4';const a=await get(base,'/account',keyP);if(!a.ok)return {state:'ACCOUNT_DENIED',status:a.status};
            const access=readOddsPapiEntitlement(a.body||{});
            if(access.state!=='ESPORTS_ELIGIBLE')return access;
            const left=access.remaining;
            if(left<5)return {...access,state:'QUOTA_RESERVED_BELOW_SAFE_SAMPLE_MINIMUM'};
            const from=new Date(),to=new Date(from.getTime()+36*3600e3);
            const f=await get(base,'/fixtures',keyP,{sportId:18,from:from.toISOString(),to:to.toISOString(),statusId:0,hasOdds:true});if(!f.ok)return {state:'ESPORTS_FIXTURES_DENIED',status:f.status};
            const list=rows(f.body),pick=list.find(x=>x.fixtureId);if(!pick)return {state:'NO_LOL_FIXTURES',events:list.length};
            const odds=await get(base,'/odds',keyP,{fixtureId:pick.fixtureId,language:'en',verbosity:2,oddsFormat:'decimal'});
            if(!odds.ok)return {state:'PRICE_QUERY_DENIED',status:odds.status};
            const info=qualified(odds.body);const ids=[...new Set(Object.values(info.bookSamples||{}).flatMap(v=>v.marketIds||[]))].slice(0,16);
            await new Promise(r=>setTimeout(r,1200));
            const cat=await get(base,'/markets',keyP,{language:'en'});
            const catalog=Array.isArray(cat.body)?cat.body:[];
            const marketMeta=catalog.filter(m=>ids.includes(String(m.marketId))).map(m=>({id:m.marketId,name:m.marketName,type:m.marketType,period:m.period,handicap:m.handicap,outcomes:(m.outcomes||[]).map(o=>o.outcomeName).slice(0,3)}));
            return {state:'PRICE_SAMPLE_OBTAINED',events:list.length,...info,catalogStatus:cat.status,marketMeta,exactSelectionsVerified:false};}
          async function oddsio(){if(!keyI)return {state:'NO_CONFIGURED_KEY'};const base='https://api.odds-api.io/v3';const e=await get(base,'/events',keyI,{sport:'esports',status:'pending',limit:12});if(!e.ok)return {state:'ESPORTS_EVENTS_DENIED',status:e.status};const list=rows(e.body),first=list.find(x=>x.id);if(!first)return {state:'NO_ESPORTS_EVENTS',events:list.length};const o=await get(base,'/odds',keyI,{eventId:first.id,bookmakers:'Unibet,Bet365,Rivalry,Roobet,1xBet,Betano'});return o.ok?{state:'PRICE_SAMPLE_OBTAINED',events:list.length,...qualified(o.body)}:{state:'PRICE_QUERY_DENIED',status:o.status};}
          for(const [name,fn] of [['OddsPapi',papi],['Odds-API.io',oddsio]]){try{const result=await fn();console.log('ESPORTS_SOURCE_DIAGNOSTIC',JSON.stringify({provider:name,...result}));}catch(e){console.log('ESPORTS_SOURCE_DIAGNOSTIC',JSON.stringify({provider:name,state:'CHECK_ERROR',error:String(e.name)}));}}
          console.log('NO_PRODUCTION_CHANGE — prices are not independent until exact event, selection, map, numeric line, settlement, freshness and distinct sportsbook family are verified.');
          NODE
