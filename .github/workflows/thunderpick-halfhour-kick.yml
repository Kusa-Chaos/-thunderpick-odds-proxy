name: Thunderpick Half-Hour Production Kick

on:
  schedule:
    - cron: '10 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  kick:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch current production scanner
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "Dispatching Thunderpick Simple Hourly Board at $(date -u +%FT%TZ)"
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/thunderpick-simple-hourly.yml/dispatches" \
            -d '{"ref":"main"}'
          echo 'Production dispatch accepted.'
