name: Thunderpick Market Endpoint Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/thunderpick-market-endpoint-probe.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save puppeteer-core@24.16.0
      - name: Probe Thunderpick full-market endpoints
        run: node scripts/thunderpick-market-endpoint-probe.mjs
      - name: Publish probe
        run: |
          git config user.name 'thunderpick-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/thunderpick-market-endpoint-probe.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record Thunderpick market endpoint probe [skip ci]'
          git pull --rebase --autostash origin main
          git push origin HEAD:main
